<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skin Tools Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>
body{margin:0;background:#0b1018;color:#fff;font-family:Arial;padding:18px}main{max-width:700px;margin:auto}.card{background:#121a26;border:1px solid #2c384c;border-radius:16px;padding:15px;margin:12px 0}input,select,button{width:100%;height:44px;margin:6px 0;border-radius:10px;border:1px solid #334056;background:#0d131d;color:#fff;padding:0 10px}button{background:#16c6d5;color:#fff;font-weight:900}.danger{background:#d34a5c}.muted{color:#93a0b3;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preview{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}.item{border-top:1px solid #293447;padding:10px 0;display:flex;gap:10px;align-items:center}.thumb{width:70px;height:50px;object-fit:cover;border-radius:8px;background:#283245}.item span{flex:1;font-size:12px}
</style></head><body><main><h2>⚙️ SKIN TOOLS ADMIN</h2>
<div id="login" class="card"><input id="email" placeholder="Email admin"><input id="pass" type="password" placeholder="Mật khẩu"><button onclick="login()">ĐĂNG NHẬP</button></div>
<div id="panel" style="display:none">
<div class="card"><b>➕ Thêm skin / súng / nội dung</b>
<div class="row"><select id="type"><option value="gun">Skin Súng</option><option value="character">Skin Nhân Vật</option><option value="other">Skin Khác</option></select><select id="game"><option value="FF">Free Fire</option><option value="FFMAX">Free Fire Max</option></select></div>
<input id="name" placeholder="Tên nội dung"><input id="icon" placeholder="Icon nếu không có ảnh (🔥)"><input id="badge" value="NEW" placeholder="Nhãn">
<input id="detail" placeholder="Link chi tiết (không bắt buộc)"><input id="sort" type="number" value="0" placeholder="Thứ tự">
<input id="image" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewFile()"><img id="preview" class="preview">
<button onclick="addItem()">ĐĂNG NỘI DUNG</button></div>

<div class="card"><b>🔑 Tạo key</b><div class="row"><input id="key" placeholder="KEY-XXXX"><input id="uses" type="number" value="1" placeholder="Số lượt"></div><button onclick="createKey()">TẠO KEY</button></div>

<div class="card"><b>📦 Nội dung hiện có</b><div id="list" class="muted">Đang tải...</div></div>
<button class="danger" onclick="logout()">ĐĂNG XUẤT</button><p id="msg" class="muted"></p>
</div></main>
<script>
const c=window.SUPABASE_CONFIG||{},s=window.supabase.createClient(c.url,c.anonKey);
let currentUser=null;
async function login(){const r=await s.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error)return msg.textContent=r.error.message;await check()}
async function check(){const {data:{user}}=await s.auth.getUser();if(!user)return;const {data:a}=await s.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!a)return msg.textContent='Tài khoản chưa được cấp quyền admin';currentUser=user;login.style.display='none';panel.style.display='block';loadList()}
function previewFile(){const f=image.files[0];if(!f)return;preview.src=URL.createObjectURL(f);preview.style.display='block'}
async function addItem(){
 const f=image.files[0];let image_url='';
 if(f){const path=`${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await s.storage.from('catalog-images').upload(path,f,{upsert:false,contentType:f.type});if(up.error)return msg.textContent=up.error.message;image_url=s.storage.from('catalog-images').getPublicUrl(path).data.publicUrl}
 const r=await s.from('catalog_items').insert({type:type.value,game:game.value,name:name.value.trim(),icon:icon.value||'✨',image_url,badge:badge.value||'NEW',detail_url:detail.value||null,sort_order:Number(sort.value)||0});
 msg.textContent=r.error?r.error.message:'✅ Đã đăng nội dung';if(!r.error)loadList()
}
async function createKey(){const r=await s.rpc('admin_create_key',{p_key:key.value.trim(),p_max_uses:Number(uses.value)||1});msg.textContent=r.error?r.error.message:(r.data?.ok?'✅ Đã tạo key':'❌ '+(r.data?.message||'Không tạo được'));key.value=''}
async function loadList(){const r=await s.from('catalog_items').select('id,name,type,game,image_url,active').order('created_at',{ascending:false});if(r.error)return list.textContent=r.error.message;list.innerHTML=r.data.map(x=>`<div class="item"><img class="thumb" src="${x.image_url||''}"><span>${x.name}<br><small>${x.type} • ${x.game} • ${x.active?'Đang hiện':'Ẩn'}</small></span><button style="width:95px" onclick="toggleItem('${x.id}',${x.active})">${x.active?'ẨN':'HIỆN'}</button></div>`).join('')}
async function toggleItem(id,a){await s.from('catalog_items').update({active:!a}).eq('id',id);loadList()}
async function logout(){await s.auth.signOut();location.reload()}check()
</script></body></html>
