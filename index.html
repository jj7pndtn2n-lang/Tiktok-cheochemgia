<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skin Tools Simulator</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#efe7f3;color:#fff}
body{display:flex;justify-content:center}.app{width:min(100%,480px);min-height:100vh;background:linear-gradient(180deg,#c978d9 0,#e8b8e4 44%,#f0dff0 100%);padding-bottom:24px}
.header{padding:15px 15px 8px;display:flex;align-items:center;gap:10px}.avatar{width:45px;height:45px;border-radius:12px;background:#ffffff88;display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid #fff8}.brand{flex:1;font-weight:900;font-size:14px}.brand small{display:block;font-size:10px;font-weight:500;opacity:.8;margin-top:3px}.register{border:0;border-radius:20px;padding:11px 13px;background:#19c7d5;color:#fff;font-weight:900;font-size:11px;box-shadow:0 5px 15px #2aa8b755}
.selector{margin:6px 16px 18px;padding:10px;border:1px solid #ffffff88;border-radius:25px;background:#ffffff25;box-shadow:inset 0 0 0 1px #ffffff25}.gameTabs,.typeTabs{display:flex;justify-content:space-around;gap:4px}.gameTabs button,.typeTabs button{flex:1;border:0;background:transparent;color:#fff;font-weight:900;padding:10px 5px;border-radius:18px;font-size:12px}.gameTabs button.active,.typeTabs button.active{color:#16bfd0;border-bottom:2px solid #16bfd0}.typeTabs{margin-top:3px}.typeTabs button.active{color:#fff;background:#ffffff20;border-bottom:0}
.feed{padding:0 14px}.status{color:#6b5a71;text-align:center;font-size:10px;margin:-8px 0 10px}.card{position:relative;margin:0 0 15px;border-radius:25px;overflow:hidden;min-height:208px;background:#b0a4b7;box-shadow:0 8px 20px #754e7d44;border:1px solid #fff6}.card img{width:100%;height:208px;object-fit:cover;display:block}.placeholder{height:208px;display:flex;align-items:center;justify-content:center;font-size:75px;background:linear-gradient(135deg,#6d596f,#d3a6d0)}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#0000 25%,#0008 75%,#000a)}.badge{position:absolute;left:12px;top:12px;background:#ffd22f;color:#fff;font-size:11px;font-weight:900;padding:8px 10px;border-radius:14px;box-shadow:0 2px 8px #0004}.info{position:absolute;right:10px;top:58px;width:48%;text-align:center}.info h3{font-size:18px;margin:0 0 10px;text-shadow:0 2px 5px #000}.install{width:100%;border:0;border-radius:22px;background:#16c6d5;color:#fff;font-weight:900;padding:12px 8px;font-size:12px;box-shadow:0 5px 12px #0003}.detail{display:block;margin-top:10px;color:#fff;font-weight:900;font-size:11px;text-decoration:none;text-shadow:0 1px 4px #000}.empty{text-align:center;color:#75687a;font-size:12px;padding:35px 0}.modal{display:none;position:fixed;z-index:50;inset:0;background:#000a;align-items:flex-end}.sheet{width:min(480px,100%);background:#141a25;border-radius:24px 24px 0 0;padding:20px;border:1px solid #334056}.sheet h2{margin:0 0 8px}.sheet p{color:#aab5c6;font-size:12px;line-height:1.5}.input{width:100%;height:48px;border-radius:12px;border:1px solid #36435a;background:#0b1018;color:#fff;padding:0 12px;margin-top:8px}.btn{width:100%;height:46px;margin-top:10px;border:0;border-radius:13px;background:#16c6d5;color:#fff;font-weight:900}.dark{background:#273247}.keylink{display:block;text-align:center;color:#ffd34e;font-size:12px;margin:12px 0;text-decoration:none}.toast{position:fixed;z-index:80;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 14px;border-radius:12px;font-size:12px;font-weight:900;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="avatar">🎮</div><div class="brand">SKIN TOOLS<small>SIMULATOR • V3</small></div><button class="register" onclick="toast('Khu vực tài khoản demo')">ĐĂNG KÝ</button></header>
<div class="selector">
  <div class="gameTabs"><button class="active" onclick="game('FF',this)">Free Fire</button><button onclick="game('FFMAX',this)">Free Fire Max</button></div>
  <div class="typeTabs" id="types">
    <button class="active" onclick="typeFilter('gun',this)">Skin Súng</button>
    <button onclick="typeFilter('character',this)">Skin Nhân Vật</button>
    <button onclick="typeFilter('other',this)">Skin Khác</button>
  </div>
</div>
<div class="feed"><div class="status" id="status">Đang tải nội dung...</div><div id="feed"></div></div>
</div>

<div class="modal" id="keyModal"><div class="sheet">
<h2>🔐 Xác thực để cài đặt</h2><p>Nhập key hợp lệ để mở khóa bước tiếp theo.</p>
<input class="input" id="keyInput" placeholder="KEY-XXXX-XXXX">
<button class="btn" onclick="verifyKey()">XÁC NHẬN KEY</button>
<a class="keylink" id="getKey" href="#" target="_blank">🔑 Chưa có key? Lấy key tại đây</a>
<button class="btn dark" onclick="closeKey()">ĐÓNG</button>
</div></div>
<div class="modal" id="successModal"><div class="sheet">
<h2>✅ Xác thực thành công</h2><p id="successText">Key hợp lệ. Bạn có thể tiếp tục.</p>
<button class="btn" onclick="continueToDestination()">MỞ TRANG / MỞ APP</button>
<button class="btn dark" onclick="closeSuccess()">ĐÓNG</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const cfg=window.SUPABASE_CONFIG||{};
const sb=(window.supabase&&cfg.url&&cfg.anonKey&&cfg.url.indexOf('YOUR-')===-1&&cfg.anonKey.indexOf('YOUR_')===-1)?window.supabase.createClient(cfg.url,cfg.anonKey):null;
let activeType='gun', activeGame='FF', items=[];
const demo=[
 {id:'d1',type:'gun',game:'FF',name:'Cyber Rifle',icon:'🔫',image_url:'',badge:'NEW'},
 {id:'d2',type:'gun',game:'FF',name:'Golden Eagle',icon:'💛',image_url:'',badge:'NEW'},
 {id:'d3',type:'character',game:'FF',name:'Crimson Warrior',icon:'🔥',image_url:'',badge:'NEW'},
 {id:'d4',type:'character',game:'FFMAX',name:'Cyber Phantom',icon:'🤖',image_url:'',badge:'NEW'},
 {id:'d5',type:'other',game:'FF',name:'Gold Aura',icon:'✨',image_url:'',badge:'NEW'}
];
function game(g,btn){activeGame=g;document.querySelectorAll('.gameTabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function typeFilter(t,btn){activeType=t;document.querySelectorAll('.typeTabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
async function load(){
 if(!sb){items=demo;status.textContent='DEMO DATA';render();return}
 try{
  const {data,error}=await sb.from('catalog_items').select('id,type,name,icon,image_url,badge,game,active,detail_url').eq('active',true).order('sort_order',{ascending:true});
  if(error)throw error;items=data||[];status.textContent='ĐÃ CẬP NHẬT';render();
 }catch(e){items=demo;status.textContent='DEMO DATA';render();console.log(e)}
}
function render(){
 const arr=items.filter(x=>x.game===activeGame&&x.type===activeType);
 feed.innerHTML=arr.length?arr.map(x=>`<article class="card">
 ${x.image_url?`<img src="${esc(x.image_url)}" alt="">`:`<div class="placeholder">${x.icon||'🎮'}</div>`}
 <div class="shade"></div><div class="badge">${esc(x.badge||'NEW')}</div>
 <div class="info"><h3>${esc(x.name)}</h3><button class="install" onclick="startInstall('${escAttr(x.id)}','${escAttr(x.name)}')">CÀI ĐẶT</button>${x.detail_url?`<a class="detail" href="${esc(x.detail_url)}" target="_blank">CHI TIẾT</a>`:`<a class="detail" href="#" onclick="toast('Nội dung demo')">CHI TIẾT</a>`}</div>
 </article>`).join(''):`<div class="empty">Chưa có nội dung ở danh mục này.</div>`;
}
function startInstall(id,name){window.selectedItem=items.find(x=>String(x.id)===String(id));window.selectedName=name;openKey()}
function openKey(){getKey.href=cfg.getKeyUrl||'#';keyModal.style.display='flex'}
function closeKey(){keyModal.style.display='none'}
async function verifyKey(){
 const code=keyInput.value.trim(); if(!code)return toast('Vui lòng nhập key');
 if(!sb)return toast('Chưa cấu hình Supabase');
 const {data,error}=await sb.rpc('redeem_key',{p_key:code});
 if(error){console.log(error);return toast('Không thể xác thực key')}
 if(data?.ok){localStorage.setItem('sim_key',code);closeKey();successText.textContent=`Key hợp lệ. Nội dung: ${window.selectedName||'đã chọn'}.`;successModal.style.display='flex'}
 else toast(data?.message||'❌ Key không hợp lệ');
}
function continueToDestination(){
 const url=cfg.destinationUrl||'#'; if(url==='#')return toast('Chưa cấu hình destinationUrl');
 if(window.AndroidBridge&&AndroidBridge.openUrl){AndroidBridge.openUrl(url)}else{window.open(url,'_blank')||location.assign(url)}
}
function closeSuccess(){successModal.style.display='none'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return esc(s)}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
load();
</script>
</body>
</html>
