<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battle Simulator Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#07090e;color:#fff}
body{display:flex;justify-content:center}.app{width:min(100%,520px);min-height:100vh;position:relative;overflow:hidden;background:#10151d}
.scene{height:67vh;min-height:500px;position:relative;overflow:hidden;background:
radial-gradient(circle at 50% 35%,#4b5260 0,#252b34 23%,#151a21 52%,#090c11 100%)}
.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0003,#0008 65%,#000d)}
.gridfloor{position:absolute;left:-20%;right:-20%;bottom:-5%;height:45%;background:linear-gradient(165deg,transparent 48%,#38404b 49%,transparent 50%),linear-gradient(15deg,transparent 48%,#38404b 49%,transparent 50%);opacity:.25;transform:perspective(400px) rotateX(55deg)}
.top{position:absolute;z-index:4;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.account{background:#0008;border:1px solid #ffffff22;border-radius:13px;padding:8px 10px;font-size:11px}.coin{background:#0008;border:1px solid #ffffff22;border-radius:13px;padding:8px 10px;color:#ffd34e;font-weight:800}
.character{position:absolute;z-index:2;left:50%;top:35%;transform:translate(-50%,-50%);font-size:145px;filter:drop-shadow(0 20px 18px #000b);transition:.3s}
.pet{position:absolute;z-index:2;left:68%;top:57%;font-size:48px;filter:drop-shadow(0 10px 10px #000)}
.name{position:absolute;z-index:3;left:50%;top:61%;transform:translateX(-50%);font-size:19px;font-weight:900;text-shadow:0 2px 6px #000;white-space:nowrap}.level{font-size:11px;color:#c8d0dc;text-align:center;margin-top:3px}
.menu{position:absolute;z-index:4;left:10px;right:10px;bottom:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.menu button,.action{border:1px solid #ffffff18;background:#111722dd;color:#fff;border-radius:13px;padding:10px 5px;font-weight:800;font-size:11px}.menu button.active{background:#d99c18;color:#111}
.panel{background:#0c1119;border-top:1px solid #273141;padding:13px 12px 24px;min-height:33vh}.panelhead{display:flex;justify-content:space-between;align-items:center}.panel h3{margin:0;font-size:16px}.hint{color:#8490a2;font-size:10px}
.tabs{display:flex;gap:7px;overflow:auto;margin:11px 0}.tabs button{flex:0 0 auto;border:1px solid #283244;background:#171e2a;color:#bfc8d5;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:800}.tabs button.active{background:#f0b323;color:#111;border-color:#f0b323}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{border:1px solid #273244;background:#141b26;border-radius:13px;padding:9px;text-align:center}.item.selected{border-color:#f2b52a;box-shadow:0 0 0 1px #f2b52a55}.item .pic{height:58px;display:flex;align-items:center;justify-content:center;font-size:42px}.item b{display:block;font-size:10px;margin-top:4px}.item small{display:block;color:#7f8b9e;font-size:9px;margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.action.primary{background:#f0b323;color:#111;border:0}.action{cursor:pointer}
.toast{position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;color:#111;border-radius:12px;padding:11px 15px;font-size:12px;font-weight:800;display:none;box-shadow:0 8px 30px #0008}
.modal{display:none;position:fixed;z-index:30;inset:0;background:#000b;align-items:flex-end}.sheet{width:min(520px,100%);background:#111823;border-radius:22px 22px 0 0;padding:20px;border:1px solid #293447}.sheet h2{margin:0 0 7px}.sheet p{color:#9aa6b8;font-size:12px;line-height:1.5}.progress{height:7px;background:#263143;border-radius:8px;overflow:hidden}.progress i{display:block;width:0;height:100%;background:#f0b323;transition:1.5s}.close{width:100%;margin-top:12px;height:45px;border:0;border-radius:12px;background:#242d3d;color:#fff;font-weight:900}
</style>
</head>
<body>
<div class="app">
  <div class="scene">
    <div class="gridfloor"></div>
    <div class="top"><div class="account">👤 DEMO PLAYER<br><span style="color:#8995a6">Lv. 58</span></div><div class="coin">🪙 999,999</div></div>
    <div class="character" id="character">🧙‍♂️</div>
    <div class="pet" id="pet">🐺</div>
    <div class="name" id="name">CRIMSON WARRIOR<div class="level">SKIN SIMULATOR</div></div>
    <div class="menu">
      <button class="active" onclick="category('skin',this)">👕<br>SKIN</button>
      <button onclick="category('gun',this)">🔫<br>SÚNG</button>
      <button onclick="category('pet',this)">🐾<br>TRỢ THỦ</button>
      <button onclick="category('effect',this)">✨<br>HIỆU ỨNG</button>
    </div>
  </div>

  <div class="panel">
    <div class="panelhead"><h3 id="title">TỦ ĐỒ • SKIN</h3><span class="hint">CHỌN → XEM TRƯỚC</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="items"></div>
    <div class="actions">
      <button class="action primary" onclick="apply()">⚡ ÁP DỤNG MÔ PHỎNG</button>
      <button class="action" onclick="unlock()">🔓 MỞ KHÓA</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet"><h2>🔓 Mở khóa nội dung</h2><p>Đây là bước mô phỏng. Sau này có thể kết nối hệ thống mở khóa/link rút gọn hợp lệ.</p><div class="progress"><i id="bar"></i></div><button class="close" onclick="closeModal()">ĐÓNG</button></div></div>

<script>
const db={
skin:{title:'TỦ ĐỒ • SKIN',tabs:['Tất cả','Nam','Nữ'],items:[['🔥','Crimson Warrior'],['🤖','Cyber Phantom'],['🐉','Golden Dragon'],['⚡','Neon Hunter'],['☠️','Shadow Reaper'],['👑','Royal Legend'],['🪽','Sky Guardian'],['🌌','Galaxy Hunter'],['🦾','Mecha Soldier']]},
gun:{title:'KHO VŨ KHÍ',tabs:['Tất cả','AR','SMG','Shotgun','Sniper'],items:[['🔫','Golden Eagle'],['💠','Cyber Rifle'],['🔥','Inferno AR'],['❄️','Frost Bite'],['⚡','Thunder SMG'],['🌋','Magma Shotgun'],['🌌','Galaxy Sniper'],['☠️','Shadow Rifle'],['💎','Diamond MP5']]},
pet:{title:'TRỢ THỦ',tabs:['Tất cả','Pet'],items:[['🐺','Wolf'],['🐼','Panda'],['🦅','Falcon'],['🐱','Cyber Cat'],['🐉','Dragon'],['🦊','Fox']]},
effect:{title:'HIỆU ỨNG',tabs:['Tất cả','Aura','Kill Effect','Animation'],items:[['✨','Gold Aura'],['⚡','Electric Aura'],['🔥','Flame Aura'],['💨','Shadow Aura'],['🌟','Legend Effect'],['💥','Impact Effect']]}
};
let current='skin',selected=0;
function category(type,btn){current=type;selected=0;document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function render(){
let d=db[current];document.getElementById('title').textContent=d.title;
document.getElementById('tabs').innerHTML=d.tabs.map((x,i)=>`<button class="${i===0?'active':''}" onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${x}</button>`).join('');
document.getElementById('items').innerHTML=d.items.map((x,i)=>`<div class="item ${i===selected?'selected':''}" onclick="pick(${i})"><div class="pic">${x[0]}</div><b>${x[1]}</b><small>PREVIEW</small></div>`).join('');
}
function pick(i){selected=i;render();let x=db[current].items[i];if(current==='skin'){character.textContent=x[0];name.innerHTML=x[1]+'<div class="level">SKIN SIMULATOR</div>'}if(current==='pet')pet.textContent=x[0];toast('Đã chọn '+x[1])}
function apply(){toast('⚡ Đã áp dụng mô phỏng — chỉ hiển thị trong app');document.querySelector('.character').animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:'translate(-50%,-50%) scale(1.12)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:650})}
function unlock(){modal.style.display='flex';setTimeout(()=>bar.style.width='100%',100)}
function closeModal(){modal.style.display='none';bar.style.width='0'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1900)}
render();
</script>
</body>
</html>
