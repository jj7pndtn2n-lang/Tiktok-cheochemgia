<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2f8fb">
<title>Agar Web — Bản thử nghiệm</title>
<style>
:root{--panel:rgba(72,82,86,.72)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#f2f8fb;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 1px 2px #333}
#leaderboard{position:absolute;top:max(8px,env(safe-area-inset-top));right:8px;width:150px;padding:9px 8px;background:var(--panel);text-align:center}
#leaderboard h2{font: bold 20px Georgia,serif;margin:0 0 5px}
#leaderboard ol{margin:0;padding-left:25px;text-align:left;font-size:12px;line-height:1.55;overflow-wrap:anywhere}
#minimap{position:absolute;right:8px;bottom:max(12px,env(safe-area-inset-bottom));width:142px;background:rgba(120,130,134,.78);padding:2px}
#grid{display:grid;grid-template-columns:repeat(4,1fr)}
.cell{height:35px;border:1px solid rgba(255,255,255,.36);display:flex;align-items:center;justify-content:center;position:relative;font-size:11px;color:#fff}
.marker{position:absolute;width:9px;height:9px;border-radius:50%;background:#ff3737;border:1.5px solid #fff;box-shadow:0 0 3px #333;transform:translate(-50%,-50%);left:50%;top:50%}
#score{position:absolute;left:10px;top:10px;font-size:14px;background:var(--panel);padding:7px 9px}
#hint{position:absolute;left:10px;bottom:max(12px,env(safe-area-inset-bottom));max-width:48%;font-size:12px;background:rgba(72,82,86,.58);padding:7px 9px;line-height:1.35}
#overlay{position:fixed;inset:0;background:rgba(20,35,45,.35);display:flex;align-items:center;justify-content:center;padding:20px}
#card{width:min(360px,100%);background:rgba(255,255,255,.96);border-radius:14px;padding:22px;text-align:center;color:#24313a;box-shadow:0 8px 35px #0003}
#card h1{margin:0 0 8px;font-size:28px}#card p{font-size:14px;line-height:1.5}
button{border:0;border-radius:9px;background:#2585ff;color:white;font-size:17px;font-weight:bold;padding:12px 24px}
.hidden{display:none!important}
@media(max-width:430px){#leaderboard{width:122px}#leaderboard h2{font-size:17px}#leaderboard ol{font-size:11px}#minimap{width:124px}.cell{height:30px;font-size:10px}#hint{max-width:45%;font-size:11px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Khu vực chơi Agar"></canvas>
<div id="hud">
  <div id="score">Khối lượng: <b id="mass">100</b></div>
  <section id="leaderboard"><h2>Leaderboard</h2><ol id="leaders"></ol></section>
  <section id="minimap"><div id="grid"></div></section>
  <div id="hint">Chạm vào hướng muốn đi. Ăn chấm màu để lớn lên; tránh tế bào lớn hơn.</div>
</div>
<div id="overlay">
 <div id="card"><h1>Agar Web</h1><p>Bản thử nghiệm đầu tiên. Di chuyển bằng cách chạm hoặc kéo trên màn hình. Ăn thức ăn và tránh bot lớn hơn bạn.</p><button id="start">Chơi ngay</button></div>
</div>
<script>
(()=> {
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const grid=document.querySelector('#grid'),leaders=document.querySelector('#leaders');
const overlay=document.querySelector('#overlay'),startBtn=document.querySelector('#start');
const massLabel=document.querySelector('#mass');
const WORLD={w:3600,h:3600};
const COLORS=['#12d91a','#1685ff','#ff3d9a','#ff8a22','#a64dff','#00c6d7','#f04c4c','#f0c62e'];
let W=0,H=0,dpr=1,running=false,dead=false,raf=0,last=0;
let player,foods=[],bots=[],camera={x:1800,y:1800},target={x:1800,y:1800};
const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px'}
addEventListener('resize',resize);resize();
for(let r=0;r<4;r++)for(let c=0;c<4;c++){let el=document.createElement('div');el.className='cell';el.dataset.row=r;el.dataset.col=c;el.textContent=String.fromCharCode(65+r)+(c+1);grid.appendChild(el)}
const cells=[...grid.children];
function newCell(name,x,y,r,color,isPlayer=false){return {name,x,y,r,color,isPlayer,dx:0,dy:0,think:0,tx:x,ty:y}}
function reset(){
 player=newCell('Bạn',WORLD.w/2,WORLD.h/2,22,'#2585ff',true);
 target={x:player.x+200,y:player.y};
 foods=Array.from({length:700},()=>({x:rand(20,WORLD.w-20),y:rand(20,WORLD.h-20),r:rand(2.5,4.2),color:COLORS[Math.floor(Math.random()*COLORS.length)]}));
 const names=['Mori','chip beo','Ju mbo','naruto','thuy','An unnamed cell','Thu Hồ','AFK','Uchiha','Hero','Béo ú','123'];
 bots=names.map((n,i)=>newCell(n,rand(100,WORLD.w-100),rand(100,WORLD.h-100),rand(13,35),COLORS[i%COLORS.length]));
 camera.x=player.x;camera.y=player.y;dead=false;
}
function setTarget(e){const rect=canvas.getBoundingClientRect();const x=e.clientX-rect.left,y=e.clientY-rect.top;target.x=Math.max(0,Math.min(WORLD.w,player.x+x-W/2));target.y=Math.max(0,Math.min(WORLD.h,player.y+y-H/2))}
canvas.addEventListener('pointerdown',e=>{if(running&&!dead){canvas.setPointerCapture?.(e.pointerId);setTarget(e)}});
canvas.addEventListener('pointermove',e=>{if(running&&!dead&&e.buttons)setTarget(e)});
function speed(c){return Math.max(1.25,4.1/Math.pow(c.r/22,.38))}
function steer(c,tx,ty,dt){let dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy);if(d>1){let step=Math.min(d,speed(c)*dt*0.06);c.x+=dx/d*step;c.y+=dy/d*step}c.x=Math.max(c.r,Math.min(WORLD.w-c.r,c.x));c.y=Math.max(c.r,Math.min(WORLD.h-c.r,c.y))}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function eatCheck(){
 for(let i=foods.length-1;i>=0;i--){if(distance(player,foods[i])<player.r+foods[i].r){player.r=Math.sqrt(player.r*player.r+foods[i].r*foods[i].r*.8);foods.splice(i,1)}}
 if(foods.length<600)for(let i=0;i<150;i++)foods.push({x:rand(20,WORLD.w-20),y:rand(20,WORLD.h-20),r:rand(2.5,4),color:COLORS[Math.floor(Math.random()*COLORS.length)]});
 for(let i=bots.length-1;i>=0;i--){
  const b=bots[i],d=distance(player,b);
  if(d<Math.max(player.r,b.r)*.78){
   if(player.r>b.r*1.12){player.r=Math.sqrt(player.r*player.r+b.r*b.r*.72);bots.splice(i,1);setTimeout(()=>{bots.push(newCell('Bot '+Math.floor(rand(10,99)),rand(100,WORLD.w-100),rand(100,WORLD.h-100),rand(13,31),COLORS[Math.floor(Math.random()*COLORS.length)]))},1200)}
   else if(b.r>player.r*1.12){dead=true;running=false;overlay.classList.remove('hidden');document.querySelector('#card h1').textContent='Bạn đã bị nuốt!';document.querySelector('#card p').textContent='Khối lượng cuối cùng: '+Math.round(player.r*player.r)+'. Nhấn chơi lại để thử lần nữa.';startBtn.textContent='Chơi lại';}
  }
 }
}
function updateBots(dt){
 for(const b of bots){
  b.think-=dt;
  if(b.think<=0){
   b.think=rand(400,1400);
   const threat=distance(b,player)<500&&player.r>b.r*1.12;
   if(threat){b.tx=b.x+(b.x-player.x)*1.3;b.ty=b.y+(b.y-player.y)*1.3}
   else if(distance(b,player)<650&&b.r>player.r*1.12){b.tx=player.x;b.ty=player.y}
   else {b.tx=b.x+rand(-350,350);b.ty=b.y+rand(-350,350)}
  }
  steer(b,Math.max(0,Math.min(WORLD.w,b.tx)),Math.max(0,Math.min(WORLD.h,b.ty)),dt);
  for(let i=foods.length-1;i>=0;i--)if(distance(b,foods[i])<b.r){b.r=Math.sqrt(b.r*b.r+foods[i].r*foods[i].r*.45);foods.splice(i,1)}
 }
}
function drawCell(c){
 const x=c.x-camera.x+W/2,y=c.y-camera.y+H/2;
 if(x<-c.r||x>W+c.r||y<-c.r||y>H+c.r)return;
 ctx.beginPath();ctx.arc(x,y,c.r,0,Math.PI*2);ctx.fillStyle=c.color;ctx.fill();
 ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.stroke();
 ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.font=`bold ${Math.max(9,Math.min(15,c.r*.48))}px Arial`;ctx.fillText(c.name,x,y);
}
function updateMap(){
 let col=Math.min(3,Math.floor(player.x/WORLD.w*4)),row=Math.min(3,Math.floor(player.y/WORLD.h*4));
 cells.forEach((el,i)=>{el.textContent=String.fromCharCode(65+Math.floor(i/4))+(i%4+1);el.querySelector('.marker')?.remove()});
 let dot=document.createElement('span');dot.className='marker';cells[row*4+col].appendChild(dot);
}
function updateLeaders(){
 const ranked=[player,...bots].sort((a,b)=>b.r-a.r).slice(0,10);
 leaders.innerHTML=ranked.map(c=>`<li>${c.name.replace(/[&<>"]/g,'')} — ${Math.round(c.r*c.r)}</li>`).join('');
 massLabel.textContent=Math.round(player.r*player.r);
}
function frame(now){
 raf=requestAnimationFrame(frame);const dt=Math.min(50,now-(last||now));last=now;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#f2f8fb';ctx.fillRect(0,0,W,H);
 if(!player)return;
 if(running&&!dead){steer(player,target.x,target.y,dt);updateBots(dt);eatCheck()}
 camera.x+=(player.x-camera.x)*.12;camera.y+=(player.y-camera.y)*.12;
 const left=camera.x-W/2,top=camera.y-H/2;
 ctx.strokeStyle='#e1edf1';ctx.lineWidth=1;
 for(let x=Math.floor(left/50)*50;x<left+W;x+=50){ctx.beginPath();ctx.moveTo(x-left,0);ctx.lineTo(x-left,H);ctx.stroke()}
 for(let y=Math.floor(top/50)*50;y<top+H;y+=50){ctx.beginPath();ctx.moveTo(0,y-top);ctx.lineTo(W,y-top);ctx.stroke()}
 ctx.strokeStyle='#d2e1e6';ctx.lineWidth=3;ctx.strokeRect(-left,-top,WORLD.w,WORLD.h);
 for(const f of foods){let x=f.x-camera.x+W/2,y=f.y-camera.y+H/2;if(x>-6&&x<W+6&&y>-6&&y<H+6){ctx.beginPath();ctx.arc(x,y,f.r,0,Math.PI*2);ctx.fillStyle=f.color;ctx.fill()}}
 bots.forEach(drawCell);drawCell(player);updateMap();updateLeaders();
}
startBtn.addEventListener('click',()=>{cancelAnimationFrame(raf);reset();running=true;overlay.classList.add('hidden');last=0;raf=requestAnimationFrame(frame)});
reset();frame(0);
})();
</script>
</body>
</html>
