<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8c9c3d">
<title>Grass Blade Arena — Orbit Survival</title>
<style>
:root{--safeT:env(safe-area-inset-top);--safeB:env(safe-area-inset-bottom)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87984a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;color:white;text-shadow:0 2px 3px #302d20a6}
.top{position:absolute;left:12px;right:12px;top:max(10px,var(--safeT));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{background:linear-gradient(#3b4035d9,#252b25dc);border:1.5px solid #ffffff65;border-radius:12px;padding:7px 10px;box-shadow:0 2px 5px #3334;backdrop-filter:blur(3px)}
.statline{font-size:11px;font-weight:850;letter-spacing:.2px}.big{font-size:20px;font-weight:1000;color:#ffe54b;line-height:1.1}
.level{width:112px;height:7px;background:#23271d;border:1px solid #ffffff5c;border-radius:8px;overflow:hidden;margin-top:5px}.level span{display:block;height:100%;width:22%;background:linear-gradient(90deg,#f9d54c,#f8f29c)}
.rightstat{text-align:right;min-width:92px}
#joystick{position:absolute;left:20px;bottom:calc(24px + var(--safeB));width:108px;height:108px;border-radius:50%;background:#353b2b68;border:2px solid #ffffff80;box-shadow:inset 0 0 0 5px #ffffff10;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:32px;top:32px;width:40px;height:40px;border-radius:50%;background:#d8d9b6d9;border:2px solid #fff9;box-shadow:0 2px 8px #171b16a0}
#hint{position:absolute;bottom:calc(143px + var(--safeB));right:18px;font-size:10px;text-align:right;color:#fff9}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#28311c55;backdrop-filter:blur(2px);padding:22px}
.panel{width:min(340px,100%);text-align:center;border-radius:23px;padding:26px 22px;background:linear-gradient(150deg,#4b5d2aeF,#26391feF);border:2px solid #ffffff75;box-shadow:0 15px 50px #15200c70;color:white}
.kicker{font-size:10px;letter-spacing:3px;font-weight:1000;color:#e4eaa4}
h1{font-size:38px;line-height:.95;letter-spacing:-1.5px;margin:10px 0 12px;text-shadow:0 3px #24351b}
.desc{font-size:12px;line-height:1.5;color:#f2f4d8;margin:0 0 17px}
button{border:0;border-radius:13px;padding:13px 20px;font-weight:1000;letter-spacing:1px}
#play{width:100%;color:#fff;background:linear-gradient(#ffb932,#f57b1b);border:2px solid #ffe08a;box-shadow:0 4px 0 #a74a12,0 8px 15px #15200b55;font-size:20px;text-shadow:0 2px #ad4b12}
#play:active{transform:translateY(2px);box-shadow:0 2px 0 #a74a12}
#toast{position:absolute;top:25%;left:50%;transform:translateX(-50%);background:#252d21d9;color:#fff;padding:8px 13px;border:1px solid #ffffff50;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
@media(min-width:700px){#game{max-width:430px;left:50%;transform:translateX(-50%);border-left:2px solid #ffffff35;border-right:2px solid #ffffff35} .hud{left:calc(50% - min(215px,50vw));right:calc(50% - min(215px,50vw))}#overlay{left:calc(50% - min(215px,50vw));right:calc(50% - min(215px,50vw))}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="top">
    <div class="pill"><div class="statline">⚔ LƯỠI LIỀM</div><div class="big" id="power">1</div><div class="level"><span id="xpbar"></span></div></div>
    <div class="pill rightstat"><div class="statline">🏆 ĐIỂM</div><div class="big" id="score">0</div><div class="statline" id="wave">ĐỐI THỦ</div></div>
  </div>
  <div id="hint">Di chuyển · Nhặt lưỡi liềm · Sinh tồn</div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="toast"></div>
</div>
<div id="overlay"><section class="panel"><div class="kicker">ORBIT SURVIVAL · GRASSLAND</div><h1>GRASS<br>BLADE</h1><p class="desc">Chỉ di chuyển và nhặt lưỡi liềm. Va chạm giữa hai lưỡi liềm chỉ làm mất vũ khí; bạn chỉ bị hạ khi lưỡi liềm đối thủ chém trúng nhân vật.</p><button id="play">PLAY</button></section></div>
<script>
(()=> {
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d',{alpha:false});
const $=s=>document.querySelector(s);
let W=0,H=0,D=1,last=0,elapsed=0,running=false,toastTimer=0;
const world={w:2600,h:3800},cam={x:0,y:0};
const player={x:1300,y:1900,vx:0,vy:0,r:17,hp:100,power:1,score:0,xp:0,dir:1,hit:0,blades:2,id:'you'};
let enemies=[],shots=[],orbs=[],particles=[],decor=[],keys={},joy={x:0,y:0},drag=null,spawnT=0,knifeT=0,enemyId=0;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.65);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
let seed=84312;function rnd(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
function makeDecor(){
 decor=[];
 for(let i=0;i<1700;i++){let x=rnd()*world.w,y=rnd()*world.h,t=rnd();decor.push({x,y,type:t<.42?'flower':t<.74?'grass':t<.9?'stone':'tuft',s:.5+rnd()*1.1,rot:rnd()*6.28,h:rnd()})}
 // Tall grass patches like the reference gameplay
 for(let i=0;i<115;i++){let x=80+rnd()*(world.w-160),y=80+rnd()*(world.h-160),w=28+rnd()*48,h=20+rnd()*35;decor.push({x,y,type:'bush',w,h,rot:rnd()*.2})}
}
function spawnEnemy(x,y,kind){
 const r=rnd();
 enemies.push({id:++enemyId,x:x??(cam.x+rnd()*W),y:y??(cam.y+rnd()*H),r:15,
   hp:1,kind:'playerbot',phase:rnd()*6.28,speed:50+rnd()*28,flash:0,
   blades:2+Math.floor(rnd()*3),orbit:rnd()*6.28,orbitSpeed:(rnd()<.5?-1:1)*(1.8+rnd()*1.8),
   vx:0,vy:0,brain:rnd()*3,score:0,dead:false});
}
function reset(){
 player.x=world.w/2;player.y=world.h/2;player.vx=player.vy=0;player.hp=100;
 player.power=1;player.score=0;player.xp=0;player.blades=2;elapsed=0;
 enemies=[];shots=[];orbs=[];particles=[];spawnT=0;knifeT=0;
 for(let i=0;i<7;i++)spawnEnemy(player.x+(rnd()-.5)*850,player.y+(rnd()-.5)*1100);
 for(let i=0;i<12;i++)spawnKnife(player.x+(rnd()-.5)*480,player.y+(rnd()-.5)*650,1);
 updateHud();
}
makeDecor();
function updateHud(){
 $('#power').textContent=player.blades;
 $('#score').textContent=player.score;
 $('#wave').textContent='ĐỐI THỦ '+enemies.length;
 $('#xpbar').style.width=Math.min(100,player.blades/12*100)+'%';
}
function notify(t){const el=$('#toast');el.textContent=t;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,1000)}
function spawnKnife(x,y,count=1){
 for(let i=0;i<count;i++)orbs.push({x:x+(rnd()-.5)*20,y:y+(rnd()-.5)*20,r:8,life:9999,kind:'knife',vx:(rnd()-.5)*45,vy:(rnd()-.5)*45});
}
function bladePoint(owner,i,t){
 const n=Math.max(1,owner.blades||1),a=(owner.orbit||0)+t*(owner.orbitSpeed||2.5)+i*Math.PI*2/n;
 const radius=owner===player?34:31;
 return {x:owner.x+Math.cos(a)*radius,y:owner.y+Math.sin(a)*radius*0.72,a};
}
function loseBlade(owner,x,y){
 if(owner.blades<=0)return;
 owner.blades--;burst(x,y,'#a9efff',5);
 if(owner===player)updateHud();
}
function killBot(bot){
 if(bot.dead)return;bot.dead=true;
 // The remaining blades spill out around the death location and can be collected by anyone.
 spawnKnife(bot.x,bot.y,Math.max(1,bot.blades));
 burst(bot.x,bot.y,'#ffe57a',18);
 player.score+=5;notify('Đối thủ bị hạ! Nhặt lưỡi liềm rơi ra');
 enemies=enemies.filter(e=>e!==bot);updateHud();
}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=rnd()*Math.PI*2,s=30+rnd()*100;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.25+rnd()*.35,color})}}
function update(dt){
 elapsed+=dt;
 let ix=joy.x,iy=joy.y;
 if(keys.ArrowLeft||keys.a||keys.A)ix-=1;if(keys.ArrowRight||keys.d||keys.D)ix+=1;
 if(keys.ArrowUp||keys.w||keys.W)iy-=1;if(keys.ArrowDown||keys.s||keys.S)iy+=1;
 const len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len}
 const speed=215,targetX=ix*speed,targetY=iy*speed;
 player.vx+=(targetX-player.vx)*Math.min(1,dt*15);player.vy+=(targetY-player.vy)*Math.min(1,dt*15);
 player.x=Math.max(30,Math.min(world.w-30,player.x+player.vx*dt));player.y=Math.max(30,Math.min(world.h-30,player.y+player.vy*dt));
 player.orbit=(player.orbit||0)+dt*2.8;player.orbitSpeed=1;
 cam.x+=(Math.max(0,Math.min(world.w-W,player.x-W/2))-cam.x)*Math.min(1,dt*8);
 cam.y+=(Math.max(0,Math.min(world.h-H,player.y-H/2))-cam.y)*Math.min(1,dt*8);

 // Spawn collectible blades around the map; no attack button or projectile auto-fire.
 knifeT-=dt;if(knifeT<=0){if(orbs.filter(o=>o.kind==='knife').length<48){let a=rnd()*Math.PI*2,d=180+rnd()*480;spawnKnife(Math.max(25,Math.min(world.w-25,player.x+Math.cos(a)*d)),Math.max(25,Math.min(world.h-25,player.y+Math.sin(a)*d)),1)}knifeT=1.25}
 // Simple opponent AI: bots seek the player but also drift, and carry a random number of orbiting blades.
 spawnT-=dt;if(spawnT<=0&&enemies.length<8){let a=rnd()*Math.PI*2,d=500+rnd()*450;spawnEnemy(Math.max(40,Math.min(world.w-40,player.x+Math.cos(a)*d)),Math.max(40,Math.min(world.h-40,player.y+Math.sin(a)*d)));spawnT=4.2}
 for(const e of enemies){
   e.orbit=(e.orbit||0)+dt*(e.orbitSpeed||2.3);e.brain-=dt;
   let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
   if(e.brain<=0){e.brain=1+rnd()*2;e.wander=rnd()*Math.PI*2}
   const approach=d>240?.65:d<135?-.45:.15;
   const vx=(dx/d*approach+Math.cos(e.wander||0)*.35)*e.speed;
   const vy=(dy/d*approach+Math.sin(e.wander||0)*.35)*e.speed;
   e.x=Math.max(25,Math.min(world.w-25,e.x+vx*dt));e.y=Math.max(25,Math.min(world.h-25,e.y+vy*dt));
 }
 // Physical blade-to-blade collisions. Each collision removes one blade from each side.
 // Cooldown avoids counting the same overlap every frame.
 if(!player.bladeCooldown)player.bladeCooldown=new Map();
 for(const e of [...enemies]){
   const pd=Math.hypot(e.x-player.x,e.y-player.y);
   if(pd>125)continue;
   const now=performance.now();
   for(let i=0;i<player.blades;i++){
     const p=bladePoint(player,i,elapsed);
     let collided=false;
     for(let j=0;j<e.blades;j++){
       const q=bladePoint(e,j,elapsed);
       if(Math.hypot(p.x-q.x,p.y-q.y)<13){
         const key=e.id+':p'+i+':e'+j,lastHit=player.bladeCooldown.get(key)||0;
         if(now-lastHit>650){
           player.bladeCooldown.set(key,now);
           loseBlade(player,p.x,p.y);loseBlade(e,q.x,q.y);burst((p.x+q.x)/2,(p.y+q.y)/2,'#fff4b0',8);
           if(e.blades<=0){killBot(e);break}
           // Having zero orbiting blades does NOT kill the player.
           // They can keep moving and collect loose blades to rebuild their orbit.
         }
         collided=true;break;
       }
     }
     if(collided)break;
   }
 }
 // A player dies only when an opponent's orbiting blade directly hits their body.
 // Blade-vs-blade impacts only consume blades and never kill either player by themselves.
 if(!player.bodyHitCooldown)player.bodyHitCooldown=new Map();
 for(const e of [...enemies]){
   if(e.blades<=0)continue;
   for(let j=0;j<e.blades;j++){
     const q=bladePoint(e,j,elapsed);
     if(Math.hypot(q.x-player.x,q.y-(player.y-3)) < player.r+5){
       const now=performance.now(),lastHit=player.bodyHitCooldown.get(e.id)||0;
       if(now-lastHit>1100){
         player.bodyHitCooldown.set(e.id,now);
         const dropped=Math.max(0,player.blades);
         if(dropped)spawnKnife(player.x,player.y,dropped);
         burst(player.x,player.y,'#ffdf75',18);
         player.blades=1;
         player.x=world.w/2;player.y=world.h/2;player.vx=player.vy=0;
         notify('Lưỡi liềm đối thủ đã chém trúng bạn! Hồi sinh với 1 lưỡi liềm');
         updateHud();
       }
       break;
     }
   }
 }
 // Collect loose blades by touching them. Loot is removed once, so the first player wins it.
 for(let i=orbs.length-1;i>=0;i--){
   const o=orbs[i];if(o.kind!=='knife')continue;
   o.x+=o.vx*dt;o.y+=o.vy*dt;o.vx*=Math.pow(.12,dt);o.vy*=Math.pow(.12,dt);
   if(Math.hypot(player.x-o.x,player.y-o.y)<player.r+o.r+6){
     orbs.splice(i,1);player.blades++;player.score++;burst(o.x,o.y,'#fff18b',8);notify('+1 lưỡi liềm');updateHud();continue;
   }
   for(const e of enemies){if(Math.hypot(e.x-o.x,e.y-o.y)<e.r+o.r+5){orbs.splice(i,1);e.blades++;e.score++;break}}
 }
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.t-=dt;if(p.t<=0)particles.splice(i,1)}
 player.hit=Math.max(0,player.hit-dt);updateHud();
}
function ground(){
 ctx.fillStyle='#b4a65c';ctx.fillRect(0,0,W,H);
 // warm olive grass with subtle mottled noise
 for(let y=0;y<H+36;y+=36){for(let x=0;x<W+36;x+=36){let wx=x+cam.x,wy=y+cam.y;let n=(Math.sin(wx*.027+wy*.012)+Math.cos(wx*.013-wy*.031))*.5;ctx.fillStyle=n>.3?'#aeb05a':n<-.25?'#9da956':'#a8ad57';ctx.globalAlpha=.16;ctx.fillRect(x,y,37,37);ctx.globalAlpha=1}}
}
function drawGrass(o,x,y){ctx.save();ctx.translate(x,y);ctx.rotate(o.rot||0);ctx.strokeStyle=o.type==='tuft'?'#477c30':'#69863a';ctx.lineWidth=1.5*o.s;ctx.lineCap='round';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*3*o.s,4*o.s);ctx.quadraticCurveTo(i*5*o.s,-5*o.s,i*7*o.s,-12*o.s);ctx.stroke()}ctx.restore()}
function drawBush(o,x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#777442';ctx.fillRect(-o.w*.48,-o.h*.25,o.w*.96,o.h*.65);for(let i=0;i<7;i++){let xx=(i/6-.5)*o.w;ctx.fillStyle=['#b2b25a','#c3bb66','#a3a951'][i%3];ctx.beginPath();ctx.ellipse(xx,Math.sin(i*4)*o.h*.18,o.w*.15,o.h*.36,o.rot,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawDecor(){for(const o of decor){if(o.x<cam.x-65||o.x>cam.x+W+65||o.y<cam.y-65||o.y>cam.y+H+65)continue;let x=o.x-cam.x,y=o.y-cam.y;if(o.type==='bush')drawBush(o,x,y);else if(o.type==='grass'||o.type==='tuft')drawGrass(o,x,y);else if(o.type==='flower'){ctx.fillStyle=o.h>.5?'#f0c6a1':'#e2d78c';ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(x,y,1.6*o.s,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}else{ctx.fillStyle='#807b52';ctx.beginPath();ctx.ellipse(x,y,3.5*o.s,2.5*o.s,o.rot,0,Math.PI*2);ctx.fill()}}}
function drawCrescent(x,y,ang,scale,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(scale,scale);ctx.shadowBlur=7;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,11,Math.PI*.2,Math.PI*1.8);ctx.arc(4,-1,7,Math.PI*1.75,Math.PI*.25,true);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff5c9';ctx.lineWidth=1;ctx.stroke();ctx.restore()}
function drawHero(x,y,scale,dir,enemy=false,phase=0){
 ctx.save();ctx.translate(x,y+Math.sin(phase)*1.4);ctx.scale(scale*(dir<0?-1:1),scale);
 // soft contact shadow
 ctx.fillStyle='#4b4c2a55';ctx.beginPath();ctx.ellipse(0,10,13,5,0,0,Math.PI*2);ctx.fill();
 // feet and trousers
 ctx.fillStyle=enemy?'#5c4d40':'#34485a';ctx.beginPath();ctx.ellipse(-5,7,5,4,-.3,0,Math.PI*2);ctx.ellipse(5,7,5,4,.3,0,Math.PI*2);ctx.fill();
 // body
 ctx.fillStyle=enemy?'#b9a58a':'#476b7c';ctx.beginPath();ctx.moveTo(-8,-5);ctx.quadraticCurveTo(-12,1,-7,8);ctx.lineTo(7,8);ctx.quadraticCurveTo(12,0,7,-5);ctx.closePath();ctx.fill();
 // hair / hood
 ctx.fillStyle=enemy?'#473b34':'#352f35';ctx.beginPath();ctx.moveTo(-11,-8);ctx.quadraticCurveTo(-13,-20,0,-21);ctx.quadraticCurveTo(13,-20,11,-7);ctx.lineTo(8,0);ctx.lineTo(-8,0);ctx.closePath();ctx.fill();
 // face
 ctx.fillStyle='#edc6a0';ctx.beginPath();ctx.ellipse(0,-8,7,7,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#2a2424';ctx.beginPath();ctx.ellipse(-2.5,-8,1.1,1.5,0,0,Math.PI*2);ctx.ellipse(2.5,-8,1.1,1.5,0,0,Math.PI*2);ctx.fill();
 // scarf / hair highlight
 ctx.strokeStyle=enemy?'#d9b994':'#87b9c8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,-16);ctx.quadraticCurveTo(0,-20,7,-15);ctx.stroke();
 ctx.restore()
}
function draw(){
 ground();ctx.save();ctx.translate(-cam.x,-cam.y);drawDecor();
 for(const o of orbs){if(o.kind!=='knife')continue;ctx.save();ctx.translate(o.x,o.y);ctx.shadowBlur=12;ctx.shadowColor='#ffd33d';ctx.fillStyle='#f4f4d9';ctx.strokeStyle='#ffd74d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-3,8);ctx.lineTo(4,-8);ctx.lineTo(8,-13);ctx.lineTo(7,-5);ctx.lineTo(0,10);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
 for(const e of enemies){
   ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(e.x,e.y+8,e.r*1.1,4,0,0,Math.PI*2);ctx.fill();
   drawHero(e.x,e.y,.9,1,true,e.phase);
   for(let i=0;i<e.blades;i++){const q=bladePoint(e,i,elapsed);drawCrescent(q.x,q.y,q.a+Math.PI/2,.78,'#ffb943')}
   ctx.fillStyle='#ffffff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('BOT · '+e.blades,e.x,e.y-31);
 }
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.t*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
 drawHero(player.x,player.y,1,player.dir,false,elapsed*8);
 // orbiting blades are the player's only weapon; count exactly matches collected blades.
 for(let i=0;i<player.blades;i++){const q=bladePoint(player,i,elapsed);drawCrescent(q.x,q.y,q.a+Math.PI/2,.92,'#f4f0d4')}
 ctx.restore();
 // tiny health line under hero
 ctx.fillStyle='#262d1f88';ctx.fillRect(W/2-18,H/2+28,36,4);ctx.fillStyle='#a5db62';ctx.fillRect(W/2-18,H/2+28,36*(player.hp/100),4);
}
function loop(t){const dt=Math.min(.035,(t-(last||t))/1000);last=t;if(running)update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
$('#play').addEventListener('click',()=>{reset();running=true;$('#overlay').style.display='none';notify('Bắt đầu!')});
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key]=false);
const joyEl=$('#joystick'),stick=$('#stick');
function joyMove(e){const r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy)||1,m=Math.min(33,l);joy.x=dx/l*m/33;joy.y=dy/l*m/33;stick.style.transform=`translate(${joy.x*33}px,${joy.y*33}px)`}
joyEl.addEventListener('pointerdown',e=>{drag=e.pointerId;joyEl.setPointerCapture(drag);joyMove(e)});
joyEl.addEventListener('pointermove',e=>{if(drag===e.pointerId)joyMove(e)});
function joyEnd(){drag=null;joy.x=joy.y=0;stick.style.transform='translate(0,0)'}
joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
})();
</script>
</body>
</html>
