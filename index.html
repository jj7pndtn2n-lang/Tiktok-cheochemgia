<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chéo TikTok</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 20px 15px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.btn-primary {
    background: #fe2c55;
    color: white;
}

.btn-secondary {
    background: #eee;
    color: #222;
}

.btn-logout {
    background: #222;
    color: white;
}

.hidden {
    display: none !important;
}

.message {
    margin-top: 15px;
    padding: 10px;
    border-radius: 8px;
}

.error {
    background: #fee2e2;
    color: #b91c1c;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.balance {
    text-align: center;
    background: #fef2f2;
    padding: 20px;
    border-radius: 12px;
    margin-top: 15px;
}

.balance-number {
    font-size: 40px;
    font-weight: bold;
    color: #fe2c55;
}

.admin-box {
    border: 2px solid #111;
}

.user-row {
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.user-row:last-child {
    border-bottom: none;
}

.user-buttons {
    display: flex;
    gap: 5px;
}

.user-buttons button {
    flex: 1;
}

.add {
    background: #16a34a;
    color: white;
}

.remove {
    background: #dc2626;
    color: white;
}

@media(max-width:500px) {
    .user-buttons {
        flex-wrap: wrap;
    }
}
</style>

</head>

<body>

<header>
    <h1>🎵 Chéo TikTok</h1>
    <p>Trao đổi lượt chéo cùng cộng đồng</p>
</header>

<div class="container">

<!-- ĐĂNG NHẬP -->

<div id="loginPage" class="card">

    <h2 id="formTitle">🔐 Đăng nhập</h2>

    <input
        id="email"
        type="email"
        placeholder="Nhập email">

    <input
        id="password"
        type="password"
        placeholder="Nhập mật khẩu">

    <button
        id="submitButton"
        class="btn-primary"
        onclick="submitAuth()">
        Đăng nhập
    </button>

    <button
        class="btn-secondary"
        onclick="changeAuthMode()">
        <span id="changeModeText">
            Chưa có tài khoản? Đăng ký
        </span>
    </button>

    <div id="authMessage"></div>

</div>


<!-- TRANG CHÍNH -->

<div id="homePage" class="hidden">

    <div class="card">

        <h2>👤 Tài khoản</h2>

        <p>
            Email:
            <strong id="accountEmail"></strong>
        </p>

        <p>
            Username:
            <strong id="accountUsername">
                Chưa cập nhật
            </strong>
        </p>

        <div class="balance">

            <div>
                Số lượt chéo
            </div>

            <div
                id="balanceNumber"
                class="balance-number">
                0
            </div>

        </div>

        <button
            class="btn-logout"
            onclick="logout()">
            🚪 Đăng xuất
        </button>

    </div>


    <!-- KHU VỰC CHÉO -->

    <div class="card">

        <h2>🔄 Chéo TikTok</h2>

        <p>
            Danh sách người dùng đang chờ chéo.
        </p>

        <div class="user-row">

            <strong>@nguoia</strong>

            <button
                class="btn-primary"
                onclick="crossUser('@nguoia')">
                Chéo
            </button>

        </div>

        <div class="user-row">

            <strong>@nguoib</strong>

            <button
                class="btn-primary"
                onclick="crossUser('@nguoib')">
                Chéo
            </button>

        </div>

        <div class="user-row">

            <strong>@nguoic</strong>

            <button
                class="btn-primary"
                onclick="crossUser('@nguoic')">
                Chéo
            </button>

        </div>

    </div>


    <!-- ADMIN -->

    <div
        id="adminPage"
        class="card admin-box hidden">

        <h2>👑 Quản trị Admin</h2>

        <p>
            Bạn đang sử dụng tài khoản Admin.
        </p>

        <input
            id="searchInput"
            type="text"
            placeholder="Tìm username..."
            oninput="searchUsers()">

        <div id="usersList">
            Đang tải...
        </div>

    </div>

</div>

</div>


<script>

/*
=========================================
CẤU HÌNH SUPABASE
=========================================
*/

const SUPABASE_URL =
"https://bnzhspkwkhdymdektmzh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_B-qTboqeIFCOs5au73gSbw_O-9RzZTo";


/*
=========================================
KẾT NỐI SUPABASE
=========================================
*/

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/*
=========================================
BIẾN
=========================================
*/

let registerMode = false;

let currentUser = null;

let allUsers = [];


/*
=========================================
CHUYỂN ĐĂNG NHẬP / ĐĂNG KÝ
=========================================
*/

function changeAuthMode() {

    registerMode =
        !registerMode;

    if(registerMode) {

        document.getElementById("formTitle")
        .innerText =
        "📝 Đăng ký tài khoản";

        document.getElementById("submitButton")
        .innerText =
        "Đăng ký";

        document.getElementById("changeModeText")
        .innerText =
        "Đã có tài khoản? Đăng nhập";

    } else {

        document.getElementById("formTitle")
        .innerText =
        "🔐 Đăng nhập";

        document.getElementById("submitButton")
        .innerText =
        "Đăng nhập";

        document.getElementById("changeModeText")
        .innerText =
        "Chưa có tài khoản? Đăng ký";

    }

    document.getElementById("authMessage")
    .innerHTML = "";

}


/*
=========================================
ĐĂNG NHẬP / ĐĂNG KÝ
=========================================
*/

async function submitAuth() {

    const email =
    document.getElementById("email")
    .value
    .trim();

    const password =
    document.getElementById("password")
    .value;


    const message =
    document.getElementById("authMessage");


    if(!email || !password) {

        message.innerHTML =
        '<div class="message error">' +
        'Vui lòng nhập email và mật khẩu.' +
        '</div>';

        return;

    }


    if(password.length < 6) {

        message.innerHTML =
        '<div class="message error">' +
        'Mật khẩu phải có ít nhất 6 ký tự.' +
        '</div>';

        return;

    }


    message.innerHTML =
    "Đang xử lý...";


    /*
    ĐĂNG KÝ
    */

    if(registerMode) {

        const result =
        await supabaseClient.auth.signUp({

            email: email,

            password: password

        });


        if(result.error) {

            message.innerHTML =
            '<div class="message error">' +
            result.error.message +
            '</div>';

            return;

        }


        message.innerHTML =
        '<div class="message success">' +
        'Đăng ký thành công! ' +
        'Hãy kiểm tra email nếu Supabase yêu cầu xác nhận.' +
        '</div>';

        return;

    }


    /*
    ĐĂNG NHẬP
    */

    const result =
    await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

    });


    if(result.error) {

        message.innerHTML =
        '<div class="message error">' +
        result.error.message +
        '</div>';

        return;

    }


    await loadWebsite();

}


/*
=========================================
TẢI WEBSITE
=========================================
*/

async function loadWebsite() {

    const result =
    await supabaseClient.auth.getUser();


    const user =
    result.data.user;


    if(!user) {

        return;

    }


    currentUser =
    user;


    document.getElementById("loginPage")
    .classList
    .add("hidden");


    document.getElementById("homePage")
    .classList
    .remove("hidden");


    document.getElementById("accountEmail")
    .innerText =
    user.email;


    await loadProfile(user.id);

}


/*
=========================================
TẢI PROFILE
=========================================
*/

async function loadProfile(userId) {

    const result =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", userId)
    .single();


    if(result.error) {

        console.error(
            result.error
        );

        return;

    }


    const profile =
    result.data;


    document.getElementById("accountUsername")
    .innerText =
    profile.username ||
    "Chưa cập nhật";


    document.getElementById("balanceNumber")
    .innerText =
    profile.cheo_balance ||
    0;


    /*
    KIỂM TRA ADMIN
    */

    if(profile.is_admin === true) {

        document.getElementById("adminPage")
        .classList
        .remove("hidden");


        await loadUsers();

    }

}


/*
=========================================
ĐĂNG XUẤT
=========================================
*/

async function logout() {

    await supabaseClient
    .auth
    .signOut();


    currentUser =
    null;


    document.getElementById("homePage")
    .classList
    .add("hidden");


    document.getElementById("adminPage")
    .classList
    .add("hidden");


    document.getElementById("loginPage")
    .classList
    .remove("hidden");

}


/*
=========================================
ADMIN - TẢI USER
=========================================
*/

async function loadUsers() {

    const result =
    await supabaseClient
    .from("profiles")
    .select("*")
    .order(
        "username",
        {
            ascending:true
        }
    );


    if(result.error) {

        document.getElementById("usersList")
        .innerHTML =
        '<div class="message error">' +
        result.error.message +
        '</div>';

        return;

    }


    allUsers =
    result.data;


    displayUsers(
        allUsers
    );

}


/*
=========================================
HIỂN THỊ USER
=========================================
*/

function displayUsers(users) {

    const list =
    document.getElementById("usersList");


    list.innerHTML = "";


    users.forEach(function(user) {


        if(user.is_admin === true) {

            return;

        }


        const row =
        document.createElement("div");


        row.className =
        "user-row";


        row.innerHTML =

        "<strong>" +
        (user.username || "Người dùng") +
        "</strong>" +

        "<br>" +

        "Lượt chéo: " +

        "<b>" +
        (user.cheo_balance || 0) +
        "</b>" +

        '<div class="user-buttons">' +

        '<button class="add" ' +
        'onclick="adjustBalance(\'' +
        user.id +
        '\', 1)">' +
        '+1' +
        '</button>' +

        '<button class="add" ' +
        'onclick="adjustBalance(\'' +
        user.id +
        '\', 5)">' +
        '+5' +
        '</button>' +

        '<button class="add" ' +
        'onclick="adjustBalance(\'' +
        user.id +
        '\', 10)">' +
        '+10' +
        '</button>' +

        '<button class="remove" ' +
        'onclick="adjustBalance(\'' +
        user.id +
        '\', -1)">' +
        '-1' +
        '</button>' +

        '</div>';


        list.appendChild(row);

    });

}


/*
=========================================
TÌM USER
=========================================
*/

function searchUsers() {

    const keyword =
    document.getElementById("searchInput")
    .value
    .toLowerCase();


    const filtered =
    allUsers.filter(function(user) {

        return (
            user.username ||
            ""
        )
        .toLowerCase()
        .includes(keyword);

    });


    displayUsers(
        filtered
    );

}


/*
=========================================
ADMIN CỘNG / TRỪ LƯỢT
=========================================
*/

async function adjustBalance(
    userId,
    amount
) {


    const result =
    await supabaseClient
    .rpc(
        "admin_adjust_balance",
        {
            target_user_id:
            userId,

            amount:
            amount
        }
    );


    if(result.error) {

        alert(
            "Lỗi: " +
            result.error.message
        );

        return;

    }


    alert(
        "Đã cập nhật lượt thành công!\n" +
        "Lượt mới: " +
        result.data
    );


    await loadUsers();

}


/*
=========================================
CHÉO
=========================================
*/

function crossUser(username) {

    alert(
        "Bạn đã chọn chéo cho " +
        username +
        ".\n\n" +
        "Hệ thống chéo thật sẽ được hoàn thiện ở bước tiếp theo."
    );

}


/*
=========================================
KIỂM TRA SESSION KHI MỞ WEBSITE
=========================================
*/

async function checkSession() {

    const result =
    await supabaseClient.auth.getSession();


    if(
        result.data.session
    ) {

        await loadWebsite();

    }

}


checkSession();


/*
=========================================
THEO DÕI ĐĂNG NHẬP
=========================================
*/

supabaseClient.auth
.onAuthStateChange(
    function(event, session) {

        if(session) {

            loadWebsite();

        }

    }
);

</script>

</body>
</html>
